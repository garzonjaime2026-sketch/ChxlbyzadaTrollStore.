name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear proyecto iOS
        run: |
          mkdir -p App/Sources
          mkdir -p App/Assets.xcassets/AppIcon.appiconset

          cat > App/Sources/main.swift <<'EOF'
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions:
                  [UIApplication.LaunchOptionsKey: Any]? = nil
              ) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)

                  let webView = WKWebView(frame: window.bounds)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]

                  if let htmlURL = Bundle.main.url(
                      forResource: "index",
                      withExtension: "html"
                  ) {
                      webView.loadFileURL(
                          htmlURL,
                          allowingReadAccessTo: htmlURL.deletingLastPathComponent()
                      )
                  }

                  window.rootViewController = UIViewController()
                  window.rootViewController?.view = webView
                  window.makeKeyAndVisible()

                  self.window = window
                  return true
              }
          }
          EOF

          cp index.html App/index.html
          cp AppIcon-1024.png App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

          cat > App/Assets.xcassets/Contents.json <<'EOF'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

          cat > App/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

          cat > App/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Chxlbyzada</string>

              <key>CFBundleExecutable</key>
              <string>Chxlbyzada</string>

              <key>CFBundleIdentifier</key>
              <string>com.chxlbyzada.trollstore</string>

              <key>CFBundleName</key>
              <string>Chxlbyzada</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchStoryboardName</key>
              <string></string>

              <key>UIMainStoryboardFile</key>
              <string></string>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compilar aplicación
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          swiftc \
            -sdkroot "$SDK" \
            -target arm64-apple-ios15.0 \
            -emit-executable \
            App/Sources/main.swift \
            -o App/Chxlbyzada \
            -framework UIKit \
            -framework WebKit

      - name: Preparar IPA
        run: |
          mkdir -p Payload/Chxlbyzada.app

          cp App/Chxlbyzada Payload/Chxlbyzada.app/
          cp App/Info.plist Payload/Chxlbyzada.app/
          cp App/index.html Payload/Chxlbyzada.app/

          xcrun actool \
            App/Assets.xcassets \
            --compile Payload/Chxlbyzada.app \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/asset-info.plist

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIcons:dict" \
            Payload/Chxlbyzada.app/Info.plist 2>/dev/null || true

          zip -r Chxlbyzada-TrollStore.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Chxlbyzada-TrollStore-IPA
          path: Chxlbyzada-TrollStore.ipa
