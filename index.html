<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0d">
  <title>Chxlbyzada.file</title>

  <style>
    :root {
      --bg: #020817;
      --panel: rgba(5, 20, 48, .94);
      --panel-2: rgba(8, 28, 62, .96);
      --border: rgba(55, 150, 255, .28);
      --text: #ffffff;
      --muted: #b8c8dc;
      --accent: #1d8cff;
      --accent-text: #ffffff;
      --success: #5ec8ff;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(30,140,255,.22), transparent 38%),
        linear-gradient(145deg, #010611, #061a38 55%, #020817);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .bolinhas {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bolinha {
      position: absolute;
      top: -12px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #4db8ff;
      opacity: .72;
      box-shadow: 0 0 10px #2ea8ff, 0 0 20px rgba(46,168,255,.55);
      filter: blur(.2px);
      animation: cair linear infinite;
    }

    @keyframes cair {
      from { transform: translateY(-20px); }
      to { transform: translateY(110vh); }
    }

    .painel {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 24px rgba(255,0,45,.22),
        0 28px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,0,45,.14);
    }

    .topbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .brand > div {
      display: flex;
      flex-direction: column;
      align-items: center;
      order: 1;
    }

    .logo {
      width: 64px;
      height: 64px;
      order: 2;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #fff, #bdbdc4);
      color: #08080a;
      font-weight: 900;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(255,255,255,.12);
    }

    .brand h1 {
      font-size: 16px;
      line-height: 1.1;
      letter-spacing: .08em;
      font-weight: 800;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid rgba(69,224,139,.16);
      border-radius: 999px;
      background: rgba(69,224,139,.06);
      color: var(--success);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 10px 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      transition: .2s ease;
    }

    .tab:hover { color: #ffffff; background: rgba(255,255,255,.05); }

    .tab.active {
      color: var(--accent-text);
      background: var(--accent);
      box-shadow: 0 4px 14px rgba(255,255,255,.1);
    }

    .section {
      display: grid;
      gap: 12px;
      animation: aparecer .18s ease-out;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel-2);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 42px;
    }

    .option + .option {
      border-top: 1px solid rgba(255,255,255,.055);
      margin-top: 7px;
      padding-top: 7px;
    }

    .label strong {
      display: block;
      font-size: 13px;
      font-weight: 750;
    }

    .label small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    input[type="checkbox"] {
      appearance: none;
      width: 40px;
      height: 22px;
      flex: 0 0 auto;
      border: 1px solid #3a3a44;
      border-radius: 999px;
      background: #202027;
      cursor: pointer;
      transition: .2s ease;
      position: relative;
    }

    input[type="checkbox"]::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #8b8b96;
      transition: .2s ease;
    }

    input[type="checkbox"]:checked {
      border-color: #ffffff;
      background: #fff;
    }

    input[type="checkbox"]:checked::after {
      transform: translateX(18px);
      background: #08080a;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .value {
      min-width: 28px;
      padding: 3px 7px;
      border-radius: 7px;
      background: rgba(255,255,255,.08);
      color: #ffffff;
      text-align: center;
      font-size: 11px;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #15151b;
      color: #ffffff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    select:focus { border-color: rgba(255,255,255,.28); }

    input[type="range"] {
      width: 100%;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .radio-title {
      margin-bottom: 10px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .radio-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255,255,255,.025);
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
    }

    input[type="radio"] { accent-color: #ffffff; }

    .avatar-wrap {
      display: grid;
      place-items: center;
      padding: 14px 0 18px;
    }

    .avatar {
      position: relative;
      width: 120px;
      height: 190px;
      filter: drop-shadow(0 0 12px rgba(60,170,255,.18));
    }

    .avatar-part {
      position: absolute;
      background: #9aa8b8;
      border: 2px solid #d7e7f8;
      box-shadow: inset 0 0 8px rgba(0,0,0,.35);
      transition: .2s ease;
    }

    .avatar-head {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      top: 4px;
      left: 39px;
    }

    .avatar-chest {
      width: 62px;
      height: 78px;
      border-radius: 18px 18px 12px 12px;
      top: 48px;
      left: 29px;
    }

    .avatar-leg-left,
    .avatar-leg-right {
      width: 22px;
      height: 58px;
      top: 122px;
      border-radius: 8px;
    }

    .avatar-leg-left { left: 35px; }
    .avatar-leg-right { left: 63px; }

    .avatar-foot {
      position: absolute;
      width: 31px;
      height: 14px;
      top: 176px;
      border-radius: 8px 12px 6px 6px;
      background: #9aa8b8;
      border: 2px solid #d7e7f8;
      transition: .2s ease;
    }

    .avatar-foot-left { left: 24px; }
    .avatar-foot-right { left: 65px; }

    .avatar-part.active,
    .avatar-foot.active {
      background: #29b6ff;
      border-color: #e9f8ff;
      box-shadow:
        0 0 8px #29b6ff,
        0 0 18px #29b6ff,
        0 0 34px rgba(41,182,255,.85);
    }

    #mensagem {
      display: none;
      padding: 9px 10px;
      border: 1px solid rgba(69,224,139,.16);
      border-radius: 10px;
      background: rgba(69,224,139,.06);
      color: var(--success);
      text-align: center;
      font-size: 11px;
      font-weight: 750;
    }

    .empty {
      padding: 28px 15px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .footer {
      margin-top: 15px;
      color: #b8c8dc;
      text-align: center;
      font-size: 9px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .painel { padding: 17px; border-radius: 20px; }
      .status { display: none; }
    }
  </style>
</head>

        <div>
          <h1>Chxlbyzada.file</h1>
          <span>EXTERNAL • PROFESSIONAL UI</span>
        </div>
      </div>
      <div class="status">Online</div>
    </header>

    <nav class="tabs" aria-label="Navegação">
      <button class="tab active" data-tab="aimbot">Aimbot</button>
      <button class="tab" data-tab="config">Config</button>
      <button class="tab" data-tab="extra">Extra</button>
    </nav>

    <section id="conteudo" aria-live="polite"></section>

    <div class="footer">Painel local • interface demonstrativa</div>
  </main>

  <script>
    const conteudo = document.getElementById("conteudo");
    const tabs = document.querySelectorAll(".tab");

    function mensagemSucesso() {
      const msg = document.getElementById("mensagem");
      if (!msg) return;

      msg.style.display = "block";
      clearTimeout(msg._timer);
      msg._timer = setTimeout(() => {
        msg.style.display = "none";
      }, 1800);
    }

    function ativarListeners() {
      conteudo.querySelectorAll('input[type="checkbox"]').forEach((box) => {
        box.addEventListener("change", () => {
          const msg = document.getElementById("mensagem");

          const head = document.getElementById("avatarHead");
          const chest = document.getElementById("avatarChest");
          const footLeft = document.getElementById("avatarFootLeft");
          const footRight = document.getElementById("avatarFootRight");

          if (box.id === "corpoCabeca" && head) head.classList.toggle("active", box.checked);
          if (box.id === "corpoPeito" && chest) chest.classList.toggle("active", box.checked);
          if (box.id === "corpoPes" && footLeft && footRight) {
            footLeft.classList.toggle("active", box.checked);
            footRight.classList.toggle("active", box.checked);
          }

          if (msg) {
            const nomes = {
              dnsSpeed: "DNS speed",
              corpoPeito: "Peito",
              corpoCabeca: "Cabeça",
              corpoPes: "Pés"
            };
            const nome = nomes[box.id] || "Opção";
            msg.textContent = box.checked
              ? "✓ " + nome + " ativado"
              : "✓ " + nome + " desativado";
          }
          mensagemSucesso();
        });
      });

      conteudo.querySelectorAll('input[type="radio"], select, input[type="range"]').forEach((control) => {
        control.addEventListener("change", mensagemSucesso);
      });

      const range = document.getElementById("fov");
      const value = document.getElementById("fovValue");

      if (range && value) {
        range.addEventListener("input", () => {
          value.textContent = range.value;
        });
      }
    }

    function abrirAba(aba) {
      tabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.tab === aba);
      });

      if (aba === "aimbot") {
        conteudo.innerHTML = `
          <div class="section">
            <div class="card">
              <div class="option">
                <div class="label">
                  <strong>Light Aim</strong>
                  <small>Ajuste principal de mira</small>
                </div>
                <input type="checkbox" id="light" aria-label="Light Aim">
              </div>

              <div class="option">
                <div class="label">
                  <strong>Head Trick</strong>
                  <small>Configuração de prioridade</small>
                </div>
                <input type="checkbox" id="head" aria-label="Head Trick">
              </div>
            </div>

            <div class="card field">
              <div class="field-title">
                <span>FOV</span>
                <span class="value" id="fovValue">5</span>
              </div>
              <input type="range" min="0" max="10" value="5" id="fov" aria-label="FOV">
            </div>

            <div class="card section">
              <div class="field">
                <div class="field-title"><span>Auxílio</span></div>
                <select id="auxilio">
                  <option>Auxilio Head</option>
                  <option>Auxilio Corpo</option>
                </select>
              </div>

              <div class="field">
                <div class="field-title"><span>Prioridade</span></div>
                <select id="prioridade">
                  <option>Prioridade: Cabeça</option>
                  <option>Prioridade: Corpo</option>
                </select>
              </div>
            </div>

            <div class="card">
              <div class="radio-title">Tipo de Aimbot</div>
              <div class="radio-row">
                <label class="radio-option">
                  <input type="radio" name="tipo" checked>
                  Ao Atirar
                </label>
                <label class="radio-option">
                  <input type="radio" name="tipo">
                  Ao Olhar
                </label>
              </div>
            </div>

            <div id="mensagem">✓ Configuração atualizada</div>
          </div>
        `;
      }

      if (aba === "config") {
        conteudo.innerHTML = `
          <div class="section">
            <div class="card">
              <div class="option">
                <div class="label">
                  <strong>Recoil</strong>
                  <small>Controle de configuração</small>
                </div>
                <input type="checkbox" id="recoil">
              </div>

              <div class="option">
                <div class="label">
                  <strong>Auxílio</strong>
                  <small>Assistência adicional</small>
                </div>
                <input type="checkbox" id="aux">
              </div>

              <div class="option">
                <div class="label">
                  <strong>Bypass</strong>
                  <small>Opção avançada</small>
                </div>
                <input type="checkbox" id="bypass">
              </div>
            </div>

            <div id="mensagem">✓ Configuração atualizada</div>
          </div>
        `;
      }

      if (aba === "extra") {
        conteudo.innerHTML = `
          <div class="section">
            <div class="card">
              <div class="option">
                <div class="label">
                  <strong>DNS speed</strong>
                  <small>Ative a opção de otimização DNS</small>
                </div>
                <input type="checkbox" id="dnsSpeed" aria-label="DNS speed">
              </div>
            </div>

            <div class="card">
              <div class="radio-title">Personagem / Partes do corpo</div>

              <div class="avatar-wrap" aria-label="Avatar de demonstração">
                <div class="avatar">
                  <div class="avatar-part avatar-head" id="avatarHead"></div>
                  <div class="avatar-part avatar-chest" id="avatarChest"></div>
                  <div class="avatar-part avatar-leg-left"></div>
                  <div class="avatar-part avatar-leg-right"></div>
                  <div class="avatar-foot avatar-foot-left" id="avatarFootLeft"></div>
                  <div class="avatar-foot avatar-foot-right" id="avatarFootRight"></div>
                </div>
              </div>

              <div class="option">
                <div class="label">
                  <strong>Peito</strong>
                  <small>Acende a parte selecionada no avatar</small>
                </div>
                <input type="checkbox" id="corpoPeito" aria-label="Peito">
              </div>

              <div class="option">
                <div class="label">
                  <strong>Cabeça</strong>
                  <small>Acende a parte selecionada no avatar</small>
                </div>
                <input type="checkbox" id="corpoCabeca" aria-label="Cabeça">
              </div>

              <div class="option">
                <div class="label">
                  <strong>Pés</strong>
                  <small>Acende a parte selecionada no avatar</small>
                </div>
                <input type="checkbox" id="corpoPes" aria-label="Pés">
              </div>
            </div>

            <div id="mensagem">✓ Opção atualizada</div>
          </div>
        `;
      }

      ativarListeners();
    }

    function gerarBolinhas() {
      const container = document.querySelector(".bolinhas");
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < 55; i++) {
        const b = document.createElement("div");
        b.className = "bolinha";
        b.style.left = `${Math.random() * 100}vw`;
        b.style.animationDuration = `${4 + Math.random() * 7}s`;
        b.style.animationDelay = `${Math.random() * -8}s`;
        b.style.opacity = `${0.08 + Math.random() * 0.2}`;
        fragment.appendChild(b);
      }

      container.appendChild(fragment);
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => abrirAba(tab.dataset.tab));
    });

    gerarBolinhas();
    abrirAba("aimbot");
  </script>
</body>
</html>
