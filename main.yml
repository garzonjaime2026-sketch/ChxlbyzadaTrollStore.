name: Build TrollStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear aplicación
        shell: bash
        run: |
          set -e

          mkdir -p build/Payload/Chxlbyzada.app

          cat > main.swift <<'EOF'
          import UIKit
          import WebKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions:
                  [UIApplication.LaunchOptionsKey: Any]? = nil
              ) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)

                  let webView = WKWebView(frame: window.bounds)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]

                  if let url = Bundle.main.url(
                      forResource: "index",
                      withExtension: "html"
                  ) {
                      webView.loadFileURL(
                          url,
                          allowingReadAccessTo: url.deletingLastPathComponent()
                      )
                  }

                  window.rootViewController = UIViewController()
                  window.rootViewController?.view = webView
                  window.makeKeyAndVisible()

                  self.window = window
                  return true
              }
          }
          EOF

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -emit-executable \
            main.swift \
            -o build/Payload/Chxlbyzada.app/Chxlbyzada \
            -framework UIKit \
            -framework WebKit

          cp index.html build/Payload/Chxlbyzada.app/index.html

          cp AppIcon-1024.png build/Payload/Chxlbyzada.app/AppIcon-1024.png

          cat > build/Payload/Chxlbyzada.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Chxlbyzada</string>

              <key>CFBundleExecutable</key>
              <string>Chxlbyzada</string>

              <key>CFBundleIdentifier</key>
              <string>com.chxlbyzada.trollstore</string>

              <key>CFBundleName</key>
              <string>Chxlbyzada</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>MinimumOSVersion</key>
              <string>15.0</string>

              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon-1024</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                  </dict>
              </dict>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Comprobar aplicación
        run: |
          file build/Payload/Chxlbyzada.app/Chxlbyzada
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            build/Payload/Chxlbyzada.app/Info.plist

      - name: Crear IPA
        run: |
          cd build
          zip -r ../Chxlbyzada-TrollStore.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: Chxlbyzada-TrollStore-IPA
          path: Chxlbyzada-TrollStore.ipa
